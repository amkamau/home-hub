<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HomeHub{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'movies' %}">🏠 HomeHub</a>
  {% if request.user.is_authenticated %}
  <nav><a href="{% url 'movies' %}">Videos</a><a href="{% url 'files_home' %}">Shared files</a>
  {% if request.user.is_staff %}<a href="/admin/">Admin</a>{% endif %}</nav>
  <form method="post" action="{% url 'logout' %}" class="logout">{% csrf_token %}<button class="secondary" type="submit">Log out</button></form>
  {% endif %}
</header>
<main class="container">
  {% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
