
<link rel="stylesheet" href="/static/css/home.css">

{% extends "base.html" %}

{% block title %}Home · HomeHub{% endblock %}

{% block content %}
<section class="home-hero">
    <div class="hero-content">
        <h1>Everything you need.<br>
            <span>All in one place.</span>
        </h1>

        <p class="hero-description">
            Your personal space
        </p>

        <div class="hero-actions">
            <a href="{% url 'media' %}" class="home-btn home-btn-primary">
                Explore videos <span>→</span>
            </a>
            <a href="{% url 'files_home' %}" class="home-btn home-btn-outline">
                Browse files
            </a>
        </div>
    </div>

    <div class="hero-art" aria-hidden="true">
        <div class="art-orbit orbit-one"></div>
        <div class="art-orbit orbit-two"></div>
        <div class="art-glow"></div>

        <div class="art-window">
            <div class="art-window-top">
                <span></span><span></span><span></span>
                <div>HOMEHUB</div>
            </div>

            <div class="art-screen">
                <div class="art-play">▶</div>
                <div class="art-screen-lines">
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="art-mini-files">
                <div class="art-file">▶ <span>Videos</span></div>
                <div class="art-file">▤ <span>Files</span></div>
            </div>
        </div>
    </div>

    <div class="hero-decoration"></div>
</section>
