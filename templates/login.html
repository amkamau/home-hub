{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login-card">
  <div class="login-logo">H</div>
  <p class="eyebrow">YOUR PRIVATE HOME SERVER</p>
  <h1>Welcome back</h1>
  <p class="muted">Sign in to browse your videos and manage shared files.</p>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_target }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="80" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="button button-primary button-wide" type="submit">Sign in</button>
  </form>
  <p class="login-note">Accounts are created by the server administrator.</p>
</section>
{% endblock %}
